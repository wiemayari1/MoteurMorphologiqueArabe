<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4EEF2"/>
      <stop offset="1" stop-color="#7AB8BF"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#025159"/>
      <stop offset="1" stop-color="#3E848C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- soft panel -->
  <rect x="40" y="34" width="820" height="192" rx="28" fill="url(#bg)" opacity="0.75"/>

  <!-- open book -->
  <g filter="url(#shadow)">
    <path d="M200 170c80-40 160-40 240 0v30c-80-40-160-40-240 0z" fill="#fff" opacity="0.95"/>
    <path d="M440 170c80-40 160-40 240 0v30c-80-40-160-40-240 0z" fill="#fff" opacity="0.95"/>
    <path d="M435 165h10v70h-10z" fill="#e9f3f4"/>
    <path d="M200 170c80-40 160-40 240 0" fill="none" stroke="#d8e7ea" stroke-width="6" stroke-linecap="round"/>
    <path d="M440 170c80-40 160-40 240 0" fill="none" stroke="#d8e7ea" stroke-width="6" stroke-linecap="round"/>
    <path d="M220 188c60-26 120-26 180 0" fill="none" stroke="#cfe2e6" stroke-width="5" stroke-linecap="round"/>
    <path d="M480 188c60-26 120-26 180 0" fill="none" stroke="#cfe2e6" stroke-width="5" stroke-linecap="round"/>

    <!-- left cover accent -->
    <path d="M190 170c6-18 18-34 34-44 8-5 18-8 30-9v84c-12 1-22 4-30 9-16 10-28 26-34 44z"
          fill="url(#cover)" opacity="0.95"/>
  </g>

  <!-- arabic letters floating -->
  <g font-family="Amiri, serif" font-weight="700" fill="#025159" opacity="0.9">
    <text x="640" y="96" font-size="46">ض</text>
    <text x="690" y="140" font-size="38" fill="#3E848C">ع</text>
    <text x="610" y="148" font-size="34" fill="#A67458">م</text>
    <text x="740" y="110" font-size="30" fill="#7AB8BF">ك</text>
    <text x="570" y="108" font-size="28" fill="#3E848C">ت</text>
  </g>

  <!-- small dots -->
  <g opacity="0.55" fill="#A67458">
    <circle cx="780" cy="168" r="6"/>
    <circle cx="812" cy="150" r="5"/>
    <circle cx="752" cy="138" r="4"/>
  </g>
</svg>
