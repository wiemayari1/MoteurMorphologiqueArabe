<mat-card class="box">
  <h2>الجذور</h2>

  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>إضافة جذر</mat-label>
      <input matInput [(ngModel)]="newRoot" placeholder="كتب" />
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="add()">إضافة</button>
    <button mat-stroked-button (click)="refresh()">تحديث</button>
  </div>

  <div class="err" *ngIf="error">خطأ: {{error}}</div>

  <div class="list">
    <div class="item" *ngFor="let r of roots">{{r}}</div>
  </div>
</mat-card>
