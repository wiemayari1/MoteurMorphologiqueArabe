<mat-card class="box">
  <h2>التوليد</h2>

  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>الجذر (٣ أحرف)</mat-label>
      <input matInput [(ngModel)]="root" placeholder="كتب" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>الوزن</mat-label>
      <input matInput [(ngModel)]="scheme" placeholder="مفعول" />
    </mat-form-field>
  </div>

  <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading">
    توليد
  </button>

  <div class="result" *ngIf="res">
    <div *ngIf="res.ok; else err">
      <div class="ok">النتيجة: <b>{{res.word}}</b></div>
    </div>
    <ng-template #err>
      <div class="bad">خطأ: {{res.error}}</div>
    </ng-template>
  </div>
</mat-card>
