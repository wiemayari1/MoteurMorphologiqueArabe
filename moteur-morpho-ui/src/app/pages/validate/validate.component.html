<mat-card>
  <mat-card-title>التحقق من الانتماء الصرفي</mat-card-title>

  <mat-card-content class="form">
    <mat-form-field appearance="outline">
      <mat-label>الكلمة</mat-label>
      <input matInput [(ngModel)]="word" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>الجذر</mat-label>
      <input matInput [(ngModel)]="root" />
    </mat-form-field>

    <button mat-raised-button color="accent" (click)="submit()" [disabled]="loading">
      <mat-icon>fact_check</mat-icon>
      تحقق
    </button>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>

    <div *ngIf="belongs !== null" class="result">
      <span>النتيجة:</span>
      <b [class.ok]="belongs" [class.no]="!belongs">
        {{ belongs ? 'نعم' : 'لا' }}
      </b>
      <div *ngIf="belongs && schemes.length">
        الأوزان: <b>{{ schemes.join('، ') }}</b>
      </div>
    </div>

    <div class="error" *ngIf="error">{{ error }}</div>
  </mat-card-content>
</mat-card>
