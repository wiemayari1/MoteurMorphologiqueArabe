<app-page-shell [showFooterImage]="true">
  <mat-card class="validate-card">
    <div class="card-body">
      <!-- Formulaire -->
      <div class="form-section">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>أدخل الكلمة</mat-label>
          <input matInput [(ngModel)]="word" (ngModelChange)="onInputChange()" placeholder="مثال: كاتب"
            (keyup.enter)="canSubmit && submit()" />
          <mat-icon matSuffix>edit</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>أدخل الجذر</mat-label>
          <input matInput [(ngModel)]="root" (ngModelChange)="onInputChange()" placeholder="مثال: كتب"
            (keyup.enter)="canSubmit && submit()" />
          <mat-icon matSuffix>format_size</mat-icon>
        </mat-form-field>

        <div class="actions">
          <button mat-raised-button color="primary" [disabled]="!canSubmit" (click)="submit()" class="validate-btn">
            <mat-icon *ngIf="!loading">check_circle</mat-icon>
            <mat-icon *ngIf="loading" class="spin">refresh</mat-icon>
            {{ loading ? 'جاري التحقق...' : 'تحقق' }}
          </button>
        </div>
      </div>

      <!-- Résultats dans la page -->
      <div class="result-section" *ngIf="res || errorMessage">
        <!-- Succès / Résultat de validation -->
        <div class="validation-result" *ngIf="res">
          <div [class]="res.belongs ? 'result-item positive' : 'result-item negative'">
            <mat-icon>{{ res.belongs ? 'done_all' : 'error_outline' }}</mat-icon>
            <span class="message">
              الكلمة "{{ word }}"
              <b>{{ res.belongs ? 'تنتمي' : 'لا تنتمي' }}</b>
              للجذر "{{ root }}".
            </span>
          </div>
        </div>

        <!-- Erreur -->
        <div class="error-result" *ngIf="errorMessage">
          <mat-icon class="error-icon">error</mat-icon>
          <h3>حدث خطأ</h3>
          <p>{{ errorMessage }}</p>
        </div>
      </div>
    </div>
  </mat-card>
</app-page-shell>
