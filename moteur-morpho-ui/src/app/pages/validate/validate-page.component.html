<mat-card class="box">
  <h2>التحقّق</h2>

  <div class="row">
    <mat-form-field appearance="outline">
      <mat-label>الكلمة</mat-label>
      <input matInput [(ngModel)]="word" placeholder="مكتوب" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>الجذر</mat-label>
      <input matInput [(ngModel)]="root" placeholder="كتب" />
    </mat-form-field>
  </div>

  <button mat-raised-button color="primary" (click)="submit()" [disabled]="loading">
    تحقّق
  </button>

  <div class="result" *ngIf="res">
    <div *ngIf="res.ok; else err">
      <div class="ok" *ngIf="res.valid">
        النتيجة: <b>نعم</b> — الوزن: <b>{{res.scheme}}</b>
      </div>
      <div class="bad" *ngIf="res.valid === false">
        النتيجة: <b>لا</b>
      </div>
    </div>
    <ng-template #err>
      <div class="bad">خطأ: {{res.error}}</div>
    </ng-template>
  </div>
</mat-card>
