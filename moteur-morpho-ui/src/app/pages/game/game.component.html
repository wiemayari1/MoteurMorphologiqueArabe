<mat-card>
  <mat-card-title>اللعبة الصرفية</mat-card-title>
  <mat-card-subtitle>اختبر معلوماتك — في النهاية تحصل على نقاط</mat-card-subtitle>

  <mat-card-content>
    <div *ngIf="!current && !done">
      <button mat-raised-button color="primary" (click)="start()">
        <mat-icon>play_arrow</mat-icon>
        ابدأ
      </button>
    </div>

    <div *ngIf="current">
      <div class="top">
        <div>السؤال {{ qIndex + 1 }} / {{ total }}</div>
        <div>النقاط: <b>{{ score }}</b></div>
      </div>

      <mat-card class="qcard">
        <div>الكلمة: <b>{{ current.word }}</b></div>
        <div class="ask">
          {{ current.ask === 'root' ? 'ما هو الجذر؟' : 'ما هو الوزن؟' }}
        </div>
      </mat-card>

      <mat-form-field appearance="outline" class="full">
        <mat-label>إجابتك</mat-label>
        <input matInput [(ngModel)]="answer" (keyup.enter)="submit()" />
      </mat-form-field>

      <button mat-raised-button color="accent" (click)="submit()">
        <mat-icon>check</mat-icon>
        إرسال
      </button>

      <div class="msg" *ngIf="msg">{{ msg }}</div>
    </div>

    <div *ngIf="done">
      <h3>انتهت اللعبة</h3>
      <div>نتيجتك: <b>{{ score }}</b> / {{ total }}</div>
      <button mat-stroked-button (click)="start()">إعادة</button>
    </div>
  </mat-card-content>
</mat-card>
