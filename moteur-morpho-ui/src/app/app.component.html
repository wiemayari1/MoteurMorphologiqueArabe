<div class="app-root" dir="rtl" lang="ar">
  <mat-sidenav-container class="app-container">
    <mat-sidenav #snav mode="side" opened class="app-sidenav">
      <div class="brand">
        <mat-icon>account_tree</mat-icon>
        <div>
          <div class="title">المحرّك الصرفي العربي</div>
          <div class="subtitle">توليد • تحقق • لعبة</div>
        </div>
      </div>

      <mat-nav-list>
        <a mat-list-item routerLink="/" routerLinkActive="active">
          <mat-icon matListItemIcon>home</mat-icon>
          <span matListItemTitle>الرئيسية</span>
        </a>

        <a mat-list-item routerLink="/generate" routerLinkActive="active">
          <mat-icon matListItemIcon>auto_fix_high</mat-icon>
          <span matListItemTitle>توليد كلمة</span>
        </a>

        <a mat-list-item routerLink="/validate" routerLinkActive="active">
          <mat-icon matListItemIcon>fact_check</mat-icon>
          <span matListItemTitle>تحقق صرفي</span>
        </a>

        <a mat-list-item routerLink="/game" routerLinkActive="active">
          <mat-icon matListItemIcon>sports_esports</mat-icon>
          <span matListItemTitle>اللعبة</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <mat-toolbar color="primary" class="app-toolbar">
        <button mat-icon-button (click)="snav.toggle()" aria-label="menu">
          <mat-icon>menu</mat-icon>
        </button>
        <span class="toolbar-title">المحرّك الصرفي العربي</span>
        <span class="spacer"></span>
        <span class="toolbar-badge">API: 127.0.0.1:3001</span>
      </mat-toolbar>

      <main class="app-main">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
