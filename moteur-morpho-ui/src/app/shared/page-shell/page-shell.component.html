<header class="dash-header">
  <div class="dash-header__content">
    <div class="dash-header__title">{{ getPageTitle() }}</div>
  </div>
  <!-- Floating Home Button -->
  <button mat-fab class="floating-home-btn" (click)="goHome()" *ngIf="router.url !== '/'" title="الرئيسية">
    <mat-icon>home</mat-icon>
  </button>
</header>

<main class="dash">
  <section class="dash-card">
    <div class="dash-card__top" *ngIf="cardTitle && cardTitle.trim().length">
      <h2>{{ cardTitle }}</h2>
    </div>

    <div class="dash-card__body">
      <ng-content></ng-content>
    </div>

    <!-- Footer with Letter Animation Container -->
    <div class="footer-art-wrapper" *ngIf="showFooterImage">
      <div class="footer-art">
        <div class="animated-letters">
          <span class="letter">أ</span>
          <span class="letter">ب</span>
          <span class="letter">ج</span>
          <span class="letter">د</span>
          <span class="letter">ه</span>
          <span class="letter">و</span>
        </div>
        <img class="book-img" [src]="footerImageSrc" [alt]="footerImageAlt" />
      </div>
    </div>
  </section>
</main>
